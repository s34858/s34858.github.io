<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เกียรติบัตร — TANAWAN DANSAI</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

:root {
  --bg-dark: #0B0F17;
  --card-bg: rgba(21, 29, 43, 0.7);
  --card-border: rgba(255, 255, 255, 0.08);
  --accent: #00F2FE;
  --accent-gradient: linear-gradient(135deg, #00F2FE 0%, #4FACFE 100%);
  --accent-glow: rgba(0, 242, 254, 0.25);
  --text-main: #F3F4F6;
  --text-muted: #9CA3AF;
  --text-dim: #6B7280;
  --radius-lg: 24px;
  --radius-md: 16px;
  --radius-sm: 10px;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background-color: var(--bg-dark);
  color: var(--text-main);
  font-family: 'Prompt', 'Plus Jakarta Sans', sans-serif;
  line-height: 1.7;
  min-height: 100vh;
  overflow-x: hidden;

  background-image:
    radial-gradient(circle at 15% 15%, rgba(0, 242, 254, 0.08) 0%, transparent 40%),
    radial-gradient(circle at 85% 85%, rgba(79, 172, 254, 0.06) 0%, transparent 40%);
}

/* HEADER */

header {
  padding: 60px 24px 30px;
  max-width: 900px;
  margin: 0 auto;
}

.hero-card {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  backdrop-filter: blur(20px);
  border-radius: var(--radius-lg);
  padding: 36px 40px;

  display: flex;
  align-items: center;
  gap: 32px;

  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);

  position: relative;
  overflow: hidden;
}

.hero-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: var(--accent-gradient);
}

.photo-frame {
  position: relative;
  flex-shrink: 0;
}

.photo-frame img.avatar {
  width: 140px;
  height: 140px;
  border-radius: 50%;
  object-fit: cover;

  border: 3px solid rgba(255, 255, 255, 0.1);

  box-shadow: 0 0 30px var(--accent-glow);
}

.school-badge {
  position: absolute;
  bottom: 0;
  right: 0;

  width: 42px;
  height: 42px;

  border-radius: 50%;
  background: #FFFFFF;

  border: 3px solid var(--bg-dark);

  object-fit: contain;
  padding: 3px;
}

.hero-info {
  flex-grow: 1;
}

.badge-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;

  padding: 4px 12px;
  border-radius: 20px;

  background: rgba(0, 242, 254, 0.1);
  border: 1px solid rgba(0, 242, 254, 0.2);

  color: var(--accent);

  font-size: 11.5px;
  font-weight: 600;

  letter-spacing: 0.05em;
  text-transform: uppercase;

  margin-bottom: 12px;
}

.badge-tag::before {
  content: '';
  width: 6px;
  height: 6px;

  border-radius: 50%;

  background: var(--accent);
  box-shadow: 0 0 8px var(--accent);
}

.hero-info h1 {
  font-size: 30px;
  font-weight: 700;

  letter-spacing: -0.02em;

  color: #FFFFFF;

  margin-bottom: 4px;
}

.hero-info p {
  color: var(--text-muted);
  font-size: 15px;
  font-weight: 400;
}


/* NAV */

.nav-wrapper {
  position: sticky;
  top: 20px;
  z-index: 100;

  max-width: 900px;
  margin: 0 auto 30px;

  padding: 0 24px;
}

nav.tabs {
  background: rgba(15, 23, 42, 0.85);

  border: 1px solid var(--card-border);

  backdrop-filter: blur(16px);

  border-radius: 50px;

  padding: 6px;

  display: flex;
  gap: 4px;

  overflow-x: auto;

  scrollbar-width: none;

  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
}

nav.tabs::-webkit-scrollbar {
  display: none;
}

nav.tabs a {
  background: transparent;
  border: none;

  color: var(--text-muted);

  font-family: inherit;

  font-size: 14px;
  font-weight: 500;

  padding: 10px 20px;

  border-radius: 30px;

  white-space: nowrap;

  cursor: pointer;

  text-decoration: none;

  display: inline-block;

  transition: all 0.25s ease;
}

nav.tabs a:hover {
  color: var(--text-main);
}

nav.tabs a.active {
  background: var(--accent-gradient);

  color: #0B0F17;

  font-weight: 600;

  box-shadow: 0 4px 15px var(--accent-glow);
}


/* MAIN */

main {
  max-width: 900px;

  margin: 0 auto;

  padding: 0 24px 60px;
}

.panel {
  background: var(--card-bg);

  border: 1px solid var(--card-border);

  backdrop-filter: blur(20px);

  border-radius: var(--radius-lg);

  padding: 36px 40px;

  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
}

.section-header {
  margin-bottom: 24px;
}

.section-header h2 {
  font-size: 22px;

  font-weight: 700;

  color: #FFFFFF;

  display: flex;
  align-items: center;

  gap: 12px;
}

.section-header h2::before {
  content: '';

  width: 4px;
  height: 20px;

  background: var(--accent-gradient);

  border-radius: 4px;
}


/* CERTIFICATE GRID */

.honor-grid {
  display: grid;

  grid-template-columns:
    repeat(auto-fill, minmax(220px, 1fr));

  gap: 20px;
}

.honor-card {
  text-decoration: none;

  background: rgba(255, 255, 255, 0.02);

  border: 1px solid var(--card-border);

  border-radius: var(--radius-md);

  overflow: hidden;

  display: flex;
  flex-direction: column;

  cursor: pointer;

  transition: all 0.3s ease;
}

.honor-card:hover {
  transform: translateY(-6px);

  border-color: var(--accent);

  box-shadow:
    0 12px 30px rgba(0, 0, 0, 0.5);
}

.honor-thumb {
  width: 100%;

  aspect-ratio: 4 / 3;

  object-fit: cover;

  background: #000;
}

.honor-body {
  padding: 16px;

  display: flex;
  flex-direction: column;

  flex-grow: 1;

  justify-content: space-between;
}

.honor-title {
  font-size: 13.5px;

  font-weight: 500;

  color: var(--text-main);

  margin-bottom: 8px;

  line-height: 1.5;
}

.honor-year {
  font-size: 12px;

  color: var(--accent);

  font-weight: 600;
}

.honor-empty {
  grid-column: 1 / -1;

  text-align: center;

  padding: 60px 20px;

  border: 2px dashed var(--card-border);

  border-radius: var(--radius-md);

  color: var(--text-muted);
}


/* =========================
   POPUP
========================= */

.cert-modal {
  position: fixed;

  inset: 0;

  width: 100%;
  height: 100%;

  background: rgba(0, 0, 0, 0.85);

  backdrop-filter: blur(8px);

  display: flex;

  align-items: center;
  justify-content: center;

  padding: 30px;

  z-index: 9999;

  opacity: 0;

  visibility: hidden;

  pointer-events: none;

  transition:
    opacity 0.25s ease,
    visibility 0.25s ease;
}

.cert-modal.show {
  opacity: 1;

  visibility: visible;

  pointer-events: auto;
}

.cert-modal-content {
  position: relative;

  max-width: 900px;
  max-height: 90vh;

  transform: scale(0.85);

  transition: transform 0.25s ease;
}

.cert-modal.show .cert-modal-content {
  transform: scale(1);
}

.cert-modal-content img {
  display: block;

  max-width: 90vw;
  max-height: 85vh;

  width: auto;
  height: auto;

  object-fit: contain;

  border-radius: 12px;

  box-shadow:
    0 20px 60px rgba(0, 0, 0, 0.7);
}


/* ปุ่ม X */

.cert-close {
  position: absolute;

  top: -18px;
  right: -18px;

  width: 44px;
  height: 44px;

  border: none;

  border-radius: 50%;

  background: #FFFFFF;

  color: #0B0F17;

  font-size: 30px;

  line-height: 1;

  cursor: pointer;

  z-index: 10000;

  display: flex;

  align-items: center;
  justify-content: center;

  box-shadow:
    0 5px 20px rgba(0, 0, 0, 0.5);

  transition: transform 0.2s ease;
}

.cert-close:hover {
  transform: scale(1.1);
}


/* FOOTER */

.back-wrap {
  text-align: center;

  margin-top: 36px;
}

.cta-btn {
  display: inline-flex;

  align-items: center;

  gap: 10px;

  background: var(--accent-gradient);

  color: #0B0F17;

  text-decoration: none;

  font-weight: 600;

  font-size: 15px;

  padding: 14px 32px;

  border-radius: 30px;

  box-shadow:
    0 8px 25px var(--accent-glow);

  transition: all 0.25s ease;
}

.cta-btn:hover {
  transform: translateY(-2px);

  box-shadow:
    0 12px 35px var(--accent-glow);
}

footer {
  text-align: center;

  padding: 30px 20px;

  color: var(--text-dim);

  font-size: 12.5px;

  border-top: 1px solid var(--card-border);
}


/* ANIMATION */

@keyframes slideUp {

  from {
    opacity: 0;

    transform: translateY(16px);
  }

  to {
    opacity: 1;

    transform: translateY(0);
  }

}

.reveal-item {
  opacity: 0;

  animation:
    slideUp 0.4s
    cubic-bezier(0.16, 1, 0.3, 1)
    forwards;
}


/* PAGE TRANSITION */

.curtain {
  position: fixed;

  inset: 0;

  background: var(--bg-dark);

  transform: scaleY(0);

  transform-origin: bottom;

  z-index: 99999;

  pointer-events: none;
}

.curtain.active {
  transition:
    transform 0.5s
    cubic-bezier(0.76, 0, 0.24, 1);

  transform: scaleY(1);
}


/* MOBILE */

@media (max-width: 768px) {

  .hero-card {
    flex-direction: column;

    text-align: center;

    padding: 30px 20px;

    gap: 20px;
  }

  .photo-frame img.avatar {
    width: 120px;
    height: 120px;
  }

  .panel {
    padding: 28px 20px;
  }

  .cert-modal {
    padding: 20px;
  }

  .cert-modal-content img {
    max-width: 85vw;
    max-height: 80vh;
  }

  .cert-close {
    top: -15px;
    right: -5px;

    width: 40px;
    height: 40px;

    font-size: 26px;
  }

}

</style>
</head>

<body>

<div class="curtain" id="curtain"></div>


<header>

  <div class="hero-card">

<div class="nav-wrapper">

  <section class="panel" id="honors">

        เกียรติบัตร &amp; รางวัล
      </h2>

      class="honor-grid"
      id="honor-grid"
    ></div>

  </section>

    <a
      href="portfolio.html"
      class="cta-btn"
      data-transition

<!-- =========================
     CERTIFICATE POPUP
========================= -->

<div
  class="cert-modal"
  id="certModal"
>

  <div class="cert-modal-content">

    <button
      class="cert-close"
      id="certClose"
      aria-label="ปิด"
    >
      &times;
    </button>

    <img
      id="certModalImage"
      src=""
      alt="เกียรติบัตร"
    >

  </div>

</div>


<script>


/* =========================
   ข้อมูลเกียรติบัตร
========================= */

const honors = [

  {
    img: 'cert5.jpg',
    title: 'ทดสอบกำลังใจ กระโดดหอสูง34 ฟุต (นศท.)',
    year: '2569'
  },

  {
    img: 'cert6.jpg',
    title: 'อบรมการปฐมพยาบาลฉุกเฉินเเละการกู้ชีพขั้นพื้นฐาน',
    year: '2569'
  },

  {
    img: 'pca-cert.jpg',
    title: 'รางวัลชนะเลิศการเเข่งขันเพาะกาย',
    year: '2569'
  }

];


const honorGrid =
  document.getElementById('honor-grid');

const certModal =
  document.getElementById('certModal');

const certModalImage =
  document.getElementById('certModalImage');

const certClose =
  document.getElementById('certClose');


/* =========================
   สร้างการ์ดเกียรติบัตร
========================= */

if (honors.length === 0) {

  honorGrid.innerHTML =
    '<div class="honor-empty">ยังไม่มีข้อมูลเกียรติบัตร</div>';

} else {

  honorGrid.innerHTML = honors.map(h => `

    <div
      class="honor-card"
      data-cert="${h.img}"
    >

      <img
        class="honor-thumb"
        src="${h.img}"
        alt="${h.title}"
      >

      <div class="honor-body">

        <p class="honor-title">
          ${h.title}
        </p>

        ${
          h.year
            ? `<span class="honor-year">พ.ศ. ${h.year}</span>`
            : ''
        }

      </div>

    </div>

  `).join('');

}


/* =========================
   เปิด Popup
========================= */

document.querySelectorAll('.honor-card')
.forEach(card => {

  card.addEventListener('click', function() {

    const image =
      this.getAttribute('data-cert');

    certModalImage.src = image;

    certModal.classList.add('show');

    /* ป้องกันหน้าเว็บด้านหลังเลื่อน */
    document.body.style.overflow = 'hidden';

  });

});


/* =========================
   ฟังก์ชันปิด Popup
========================= */

function closeCertificate() {

  certModal.classList.remove('show');

  document.body.style.overflow = '';

  /* ล้างรูปหลังปิด */
  setTimeout(() => {
    certModalImage.src = '';
  }, 250);

}


/* =========================
   ปุ่ม X
========================= */

certClose.addEventListener(
  'click',
  closeCertificate
);


/* =========================
   คลิกพื้นหลังเพื่อปิด
========================= */

certModal.addEventListener(
  'click',
  function(e) {

    if (e.target === certModal) {

      closeCertificate();

    }

  }
);


/* =========================
   กด ESC เพื่อปิด
========================= */

document.addEventListener(
  'keydown',
  function(e) {

    if (
      e.key === 'Escape' &&
      certModal.classList.contains('show')
    ) {

      closeCertificate();

    }

  }
);


/* =========================
   Animation
========================= */

function revealPanel(panel) {

  if (!panel) return;

  const items =
    panel.querySelectorAll(
      '.section-header, p, .info-box, .edu-card, .feature-list li, .honor-card, .contact-card, .nav-card'
    );

  items.forEach((el, i) => {

    el.classList.remove('reveal-item');

    void el.offsetWidth;

    el.style.animationDelay =
      (i * 40) + 'ms';

    el.classList.add('reveal-item');

  });

}


/* =========================
   Page Transition
========================= */

document.addEventListener(
  'DOMContentLoaded',
  () => {

    const panel =
      document.querySelector('.panel');

    revealPanel(panel);


    const curtain =
      document.getElementById('curtain');


    document
      .querySelectorAll('a[data-transition]')
      .forEach(link => {

        link.addEventListener(
          'click',
          function(e) {

            const href =
              link.getAttribute('href');

            if (
              !href ||
              link.target === '_blank'
            ) return;

            e.preventDefault();

            curtain.classList.add('active');

            setTimeout(() => {

              window.location.href = href;

            }, 500);

          }
        );

      });

  }
);

</script>

</body>
</html>
